name: CI/CD React App with Docker

on:
  push:
    branches: ["main"] # Chạy workflow khi có push lên nhánh main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # Bước 1: Lấy source code từ repo
      - name: 📥 Checkout source code
        uses: actions/checkout@v3

      # Bước 2: Đăng nhập DockerHub bằng Secrets
      - name: 🔐 Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Bước 3: Build Docker image từ Dockerfile
      - name: 🛠️ Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/react-app:latest .

      # Bước 4: Push Docker image lên DockerHub
      - name: 📤 Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/react-app:latest
